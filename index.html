<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>공작기계 FSR 품질 분석 AI Agent</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>공작기계 FSR 품질 분석 AI Agent</h1>

        <p class="description">
            2010년 1월 실적 FSR 데이터를 기반으로
            공작기계 필드클레임 현황을 분석합니다.
        </p>

        <h2>AI에게 질문하기</h2>

        <div class="question-area">
            <input
                type="text"
                id="questionInput"
                placeholder="예: VMC 중에서 가장 많은 기종은 뭐야?"
            >

            <button id="sendButton">
                질문하기
            </button>
        </div>

        <h2>AI 답변</h2>

        <div id="answerBox">
            질문을 입력해주세요.
        </div>

        <h2>대화 이력</h2>

        <div id="conversationList">
            저장된 대화를 불러오는 중입니다...
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
